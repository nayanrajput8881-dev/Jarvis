<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>JARVIS Assistant</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"JARVIS","short_name":"JARVIS","start_url":".","display":"standalone","background_color":"%23000814","theme_color":"%23000814","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2740%27 fill=%27%2300d4ff%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#00d4ff;--primary-dark:#0088cc;--bg:#000814;--text:#e0f7ff;--glow:0 0 20px rgba(0,212,255,.6)}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,#001d3d 0%,#000814 70%)}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.05) 1px,transparent 1px);background-size:30px 30px;animation:gridMove 20s linear infinite;pointer-events:none;z-index:0}
@keyframes gridMove{0%{transform:translate(0,0)}100%{transform:translate(30px,30px)}}
header{position:relative;z-index:10;padding:20px 20px 10px;text-align:center}
.logo{font-size:1.4rem;font-weight:700;letter-spacing:6px;color:var(--primary);text-shadow:var(--glow);animation:pulseText 3s ease-in-out infinite}
@keyframes pulseText{0%,100%{opacity:1;text-shadow:0 0 20px rgba(0,212,255,.6)}50%{opacity:.7;text-shadow:0 0 8px rgba(0,212,255,.3)}}
.status-bar{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:.7rem;letter-spacing:2px;color:rgba(0,212,255,.5);text-transform:uppercase}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;margin-right:6px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.reactor-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:5;padding:20px}
.reactor{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.reactor:active{transform:scale(.95)}
.ring{position:absolute;border-radius:50%;border:2px solid var(--primary);opacity:.3}
.ring-1{width:100%;height:100%;border-style:dashed;animation:rotate 20s linear infinite}
.ring-2{width:80%;height:80%;border-color:var(--primary-dark);animation:rotate 15s linear infinite reverse}
.ring-3{width:60%;height:60%;border-style:dotted;animation:rotate 10s linear infinite}
@keyframes rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.core{width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,var(--primary) 0%,var(--primary-dark) 50%,transparent 70%);box-shadow:0 0 40px var(--primary),0 0 80px rgba(0,212,255,.5),inset 0 0 30px rgba(255,255,255,.5);transition:all .3s;position:relative}
.core::after{content:'';position:absolute;inset:20%;border-radius:50%;background:#fff;opacity:.8;filter:blur(8px)}
.reactor.listening .core{background:radial-gradient(circle,#00ff88 0%,#00cc66 50%,transparent 70%);box-shadow:0 0 60px #00ff88,0 0 120px rgba(0,255,136,.6),inset 0 0 40px rgba(255,255,255,.6);animation:corePulse .8s ease-in-out infinite}
.reactor.listening .ring{border-color:#00ff88;opacity:.6}
.reactor.speaking .core{background:radial-gradient(circle,#ffaa00 0%,#ff6600 50%,transparent 70%);box-shadow:0 0 60px #ffaa00,0 0 120px rgba(255,170,0,.6),inset 0 0 40px rgba(255,255,255,.6);animation:corePulse .4s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse-wave{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid #00ff88;opacity:0;pointer-events:none}
.reactor.listening .pulse-wave{animation:pulseWave 2s ease-out infinite}
.pulse-wave:nth-child(2){animation-delay:.6s}
.pulse-wave:nth-child(3){animation-delay:1.2s}
@keyframes pulseWave{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.hint{margin-top:30px;font-size:.85rem;letter-spacing:3px;color:rgba(0,212,255,.6);text-transform:uppercase;text-align:center;min-height:20px;transition:all .3s;padding:0 20px}
.transcript-area{position:relative;z-index:10;padding:0 20px 20px;max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--primary-dark) transparent}
.transcript-area::-webkit-scrollbar{width:4px}
.transcript-area::-webkit-scrollbar-thumb{background:var(--primary-dark);border-radius:2px}
.message{padding:10px 16px;border-radius:18px;font-size:.9rem;line-height:1.4;max-width:85%;animation:slideIn .3s ease-out;word-wrap:break-word}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#001d3d;font-weight:500;border-bottom-right-radius:4px}
.message.jarvis{align-self:flex-start;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--text);border-bottom-left-radius:4px}
.message.jarvis::before{content:'◈ ';color:var(--primary)}
.controls{position:relative;z-index:10;display:flex;justify-content:center;gap:30px;padding:0 20px 30px}
.btn{width:50px;height:50px;border-radius:50%;border:1px solid rgba(0,212,255,.4);background:rgba(0,212,255,.08);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.9);background:rgba(0,212,255,.2)}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.active{background:rgba(0,212,255,.3);box-shadow:0 0 15px rgba(0,212,255,.5)}
.overlay{position:fixed;inset:0;background:rgba(0,8,20,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:40px;text-align:center;transition:opacity .4s}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay h1{font-size:2rem;letter-spacing:8px;color:var(--primary);text-shadow:var(--glow);margin-bottom:20px}
.overlay p{color:rgba(0,212,255,.7);margin-bottom:40px;line-height:1.6;max-width:300px}
.start-btn{padding:16px 40px;border:2px solid var(--primary);background:transparent;color:var(--primary);font-size:1rem;letter-spacing:3px;text-transform:uppercase;border-radius:30px;cursor:pointer;transition:all .3s;font-weight:600}
.start-btn:active{background:var(--primary);color:var(--bg);box-shadow:var(--glow)}
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:30px;margin-top:20px;opacity:0;transition:opacity .3s}
.waveform.active{opacity:1}
.waveform span{width:3px;height:5px;background:#00ff88;border-radius:2px;animation:wave 1s ease-in-out infinite}
.waveform span:nth-child(1){animation-delay:0s}
.waveform span:nth-child(2){animation-delay:.1s}
.waveform span:nth-child(3){animation-delay:.2s}
.waveform span:nth-child(4){animation-delay:.3s}
.waveform span:nth-child(5){animation-delay:.4s}
.waveform span:nth-child(6){animation-delay:.3s}
.waveform span:nth-child(7){animation-delay:.2s}
.waveform span:nth-child(8){animation-delay:.1s}
.waveform span:nth-child(9){animation-delay:0s}
@keyframes wave{0%,100%{height:5px}50%{height:25px}}
.not-supported{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:40px;text-align:center;z-index:200;color:#ff6666}
.typing{display:inline-block}
.typing::after{content:'...';animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="overlay" id="overlay">
<h1>J.A.R.V.I.S</h1>
<p>Just A Rather Very Intelligent System. Tap to initialize voice interface.</p>
<button class="start-btn" id="startBtn">Initialize</button>
</div>
<div class="not-supported" id="notSupported">
<div><h2>⚠️ Browser Not Supported</h2><p style="margin-top:15px;color:#aaa">Please use Chrome, Edge, or Safari</p></div>
</div>
<header>
<div class="logo">J.A.R.V.I.S</div>
<div class="status-bar"><span><span class="status-dot"></span>Online</span><span id="modeLabel">Standby</span></div>
</header>
<div class="reactor-container">
<div class="reactor" id="reactor">
<div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
<div class="pulse-wave"></div><div class="pulse-wave"></div><div class="pulse-wave"></div>
<div class="core"></div>
</div>
<div class="hint" id="hint">Tap reactor to speak</div>
<div class="waveform" id="waveform"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
<div class="transcript-area" id="transcript"></div>
<div class="controls">
<button class="btn" id="muteBtn"><svg viewBox="0 0 24 24" id="muteIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
<button class="btn" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
<button class="btn" id="helpBtn"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></button>
</div>
<script>
// ========================================
// 🔑 YAHAN APNI GEMINI API KEY DAALO
// ========================================
const API_KEY = AQ.Ab8RN6KEJKU0IqiDmjR3qYSkpzWtrsmE9KlzHU1hFGrmN1yLgA
// ========================================

const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY;

// ===== SYSTEM SETUP =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
if (!SpeechRecognition || !synth) { document.getElementById('notSupported').style.display = 'flex'; }

const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn'),
    reactor = document.getElementById('reactor'), hint = document.getElementById('hint'),
    transcript = document.getElementById('transcript'), modeLabel = document.getElementById('modeLabel'),
    waveform = document.getElementById('waveform'), muteBtn = document.getElementById('muteBtn'),
    clearBtn = document.getElementById('clearBtn'), helpBtn = document.getElementById('helpBtn'),
    muteIcon = document.getElementById('muteIcon');

let recognition = null, isListening = false, isSpeaking = false, isMuted = false,
    voices = [], initialized = false, chatHistory = [];

// ===== VOICE SETUP =====
function loadVoices() { voices = synth.getVoices(); }
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function getJarvisVoice() {
    const p = voices.find(v => v.lang === 'en-GB' && /male|daniel|george|arthur/i.test(v.name));
    if (p) return p;
    const gb = voices.find(v => v.lang === 'en-GB');
    if (gb) return gb;
    return voices.find(v => v.lang.startsWith('en')) || voices[0];
}

function speak(text, cb) {
    if (isMuted || !synth) { if (cb) cb(); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = getJarvisVoice();
    if (v) u.voice = v;
    u.rate = 1; u.pitch = .9; u.volume = 1; u.lang = 'en-GB';
    u.onstart = () => { isSpeaking = true; reactor.classList.add('speaking'); modeLabel.textContent = 'Speaking'; hint.textContent = 'JARVIS is responding...'; };
    u.onend = () => { isSpeaking = false; reactor.classList.remove('speaking'); modeLabel.textContent = 'Standby'; hint.textContent = 'Tap reactor to speak'; if (cb) cb(); };
    u.onerror = () => { isSpeaking = false; reactor.classList.remove('speaking'); modeLabel.textContent = 'Standby'; if (cb) cb(); };
    synth.speak(u);
}

// ===== SPEECH RECOGNITION =====
function initRecognition() {
    if (!SpeechRecognition) return null;
    const rec = new SpeechRecognition();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.maxAlternatives = 1;
    let finalTranscript = '';
    rec.onstart = () => { isListening = true; finalTranscript = ''; reactor.classList.add('listening'); waveform.classList.add('active'); modeLabel.textContent = 'Listening'; hint.textContent = 'Listening...'; };
    rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalTranscript += t;
            else interim += t;
        }
        if (interim) hint.textContent = '"' + interim + '"';
    };
    rec.onerror = (e) => {
        isListening = false; reactor.classList.remove('listening'); waveform.classList.remove('active'); modeLabel.textContent = 'Standby';
        if (e.error === 'not-allowed') { hint.textContent = 'Microphone access denied'; addMessage('jarvis', 'I need microphone access, sir. Please enable it.'); }
        else if (e.error === 'no-speech') { hint.textContent = 'Tap reactor to speak'; }
        else if (e.error !== 'aborted') { hint.textContent = 'Error, try again'; }
    };
    rec.onend = () => {
        isListening = false; reactor.classList.remove('listening'); waveform.classList.remove('active');
        if (finalTranscript.trim()) handleUserInput(finalTranscript.trim());
        else { modeLabel.textContent = 'Standby'; hint.textContent = 'Tap reactor to speak'; }
    };
    return rec;
}

function startListening() {
    if (isListening || isSpeaking) {
        if (isSpeaking) { synth.cancel(); isSpeaking = false; reactor.classList.remove('speaking'); }
        return;
    }
    if (!recognition) recognition = initRecognition();
    try { recognition.start(); } catch (e) {
        if (recognition) { try { recognition.abort(); } catch (err) {} }
        recognition = initRecognition();
    }
}

function stopListening() { if (recognition && isListening) { try { recognition.stop(); } catch (e) {} } }

// ===== MESSAGES =====
function addMessage(sender, text) {
    const m = document.createElement('div');
    m.className = 'message ' + sender;
    m.textContent = text;
    transcript.appendChild(m);
    transcript.scrollTop = transcript.scrollHeight;
    while (transcript.children.length > 20) transcript.removeChild(transcript.firstChild);
}

// ===== MAIN INPUT HANDLER =====
async function handleUserInput(text) {
    addMessage('user', text);
    modeLabel.textContent = 'Processing';
    hint.textContent = 'Thinking...';

    // Local commands first
    const localReply = checkLocalCommands(text);
    if (localReply !== null) {
        if (localReply) { addMessage('jarvis', localReply); speak(localReply); }
        return;
    }

    // AI response
    const aiReply = await askGemini(text);
    if (aiReply) { addMessage('jarvis', aiReply); speak(aiReply); }
}

// ===== LOCAL COMMANDS (No API needed - Fast) =====
function checkLocalCommands(input) {
    const q = input.toLowerCase().trim();

    // Greetings
    if (/^(hi|hello|hey|greetings)$/.test(q)) {
        const h = new Date().getHours();
        let g = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
        return g + ", sir. How may I assist you?";
    }

    // How are you
    if (/how are you|how're you|kaise ho/.test(q)) return "All systems operational, sir. Running at optimal capacity.";

    // Name
    if (/what.*your name|who are you|tum kon ho/.test(q)) return "I am JARVIS. Just A Rather Very Intelligent System. At your service, sir.";

    // Time
    if (/what.*time|current time|kya time/.test(q)) {
        const n = new Date();
        return "The current time is " + n.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) + ", sir.";
    }

    // Date
    if (/what.*date|what day is it|today.*date|aaj kaunsi tarikh/.test(q)) {
        const n = new Date();
        return "Today is " + n.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ".";
    }

    // Calculator
    const m = q.match(/(?:calculate|what is|what's)?\s*(-?\d+(?:\.\d+)?)\s*([+\-*/x×÷]|plus|minus|times|divided by)\s*(-?\d+(?:\.\d+)?)/);
    if (m) {
        const a = parseFloat(m[1]), b = parseFloat(m[3]);
        let op = m[2], r;
        if (op === '+' || op === 'plus') r = a + b;
        else if (op === '-' || op === 'minus') r = a - b;
        else if (op === '*' || op === 'x' || op === '×' || op === 'times') r = a * b;
        else if (op === '/' || op === '÷' || op === 'divided by') {
            if (b === 0) return "Cannot divide by zero, sir.";
            r = a / b;
        }
        return a + " " + op + " " + b + " equals " + Math.round(r * 10000) / 10000 + ".";
    }

    // Open apps
    if (/open youtube|youtube kholo/.test(q)) { window.open("https://youtube.com", "_blank"); return "Opening YouTube, sir."; }
    if (/open google|google kholo/.test(q)) { window.open("https://google.com", "_blank"); return "Opening Google, sir."; }
    if (/open whatsapp|whatsapp kholo/.test(q)) { window.open("https://web.whatsapp.com", "_blank"); return "Opening WhatsApp, sir."; }
    if (/open instagram|instagram kholo/.test(q)) { window.open("https://instagram.com", "_blank"); return "Opening Instagram, sir."; }
    if (/open facebook|facebook kholo/.test(q)) { window.open("https://facebook.com", "_blank"); return "Opening Facebook, sir."; }
    if (/open twitter|x\.com/.test(q)) { window.open("https://twitter.com", "_blank"); return "Opening Twitter, sir."; }
    if (/open gmail|gmail kholo/.test(q)) { window.open("https://mail.google.com", "_blank"); return "Opening Gmail, sir."; }
    if (/open maps|maps kholo/.test(q)) { window.open("https://maps.google.com", "_blank"); return "Opening Maps, sir."; }

    // Google Search
    if (/search (google )?for /.test(q)) {
        const term = q.replace(/.*search (google )?for /, '').trim();
        window.open("https://www.google.com/search?q=" + encodeURIComponent(term), "_blank");
        return "Searching Google for " + term + ", sir.";
    }

    // YouTube search
    if (/play .* on youtube|youtube pe .* bajao/.test(q)) {
        const term = q.replace(/.*play |.*youtube pe /, '').replace(/ on youtube| bajao/, '').trim();
        window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(term), "_blank");
        return "Playing " + term + " on YouTube, sir.";
    }

    // WhatsApp message
    const waMatch = q.match(/whatsapp (?:message )?(?:to )?(\d{10,})/);
    if (waMatch) { window.open("https://wa.me/" + waMatch[1], "_blank"); return "Opening WhatsApp chat, sir."; }

    // Call
    const callMatch = q.match(/call (\d{10,})/);
    if (callMatch) { window.location.href = "tel:" + callMatch[1]; return "Dialing " + callMatch[1] + ", sir."; }

    // Notes - Add
    if (/add note[: ]/.test(q)) {
        const note = q.replace(/.*add note[: ]/, '').trim();
        let notes = JSON.parse(localStorage.getItem('jarvis_notes') || '[]');
        notes.push({ text: note, date: new Date().toISOString() });
        localStorage.setItem('jarvis_notes', JSON.stringify(notes));
        return "Note saved, sir: " + note;
    }

    // Notes - Show
    if (/show (my )?notes|read notes|meri notes|dikhao notes/.test(q)) {
        const notes = JSON.parse(localStorage.getItem('jarvis_notes') || '[]');
        if (notes.length === 0) return "No notes found, sir.";
        return "You have " + notes.length + " notes, sir. Latest: " + notes.slice(-3).map(n => n.text).join(", ");
    }

    // Clear notes
    if (/clear (my )?notes|delete notes|notes hatao/.test(q)) {
        localStorage.removeItem('jarvis_notes');
        return "All notes cleared, sir.";
    }

    // Weather (no API key needed)
    if (/weather|mausam|temperature|garmi|sardi/.test(q)) {
        getWeather();
        return "";  // Weather will show separately
    }

    // Battery
    if (/battery|charge/.test(q)) {
        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                const level = Math.round(b.level * 100);
                const msg = "Battery is at " + level + " percent, sir." + (b.charging ? " Currently charging." : "");
                addMessage('jarvis', msg);
                speak(msg);
            });
            return "";
        }
        return "Battery info not available, sir.";
    }

    // Location
    if (/where am i|my location|mera location|kahan hu/.test(q)) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const msg = "Your coordinates are " + pos.coords.latitude.toFixed(4) + ", " + pos.coords.longitude.toFixed(4) + ", sir.";
                addMessage('jarvis', msg);
                speak(msg);
            }, () => addMessage('jarvis', "Location access denied, sir."));
            return "";
        }
        return "Location not supported, sir.";
    }

    // Jokes
    if (/joke|make me laugh|hasao/.test(q)) {
        const j = ['Why did the AI cross the road? To optimize the other side, sir.', 'I would tell you a joke about UDP, but you might not get it.', 'Why do programmers prefer dark mode? Because light attracts bugs, sir.', 'There are 10 types of people: those who understand binary, and those who do not.'];
        return j[Math.floor(Math.random() * j.length)];
    }

    // Thanks
    if (/thank you|thanks|shukriya/.test(q)) return "You are most welcome, sir.";

    // Goodbye
    if (/goodbye|bye|good night|alvida/.test(q)) return "Goodbye, sir. I will be here if you need me.";

    // Help
    if (/help|what can you do|commands|kya kar sakte/.test(q)) {
        return "I can chat with AI, tell time and date, do calculations, save notes, check weather, battery, location, open apps, search Google, play YouTube, send WhatsApp, and more. Just ask naturally, sir.";
    }

    // Status
    if (/status|system|diagnostic/.test(q)) return "All systems nominal, sir. Voice interface online.";

    // Return null = use AI
    return null;
}

// ===== GEMINI AI =====
async function askGemini(input) {
    try {
        chatHistory.push({ role: "user", parts: [{ text: input }] });
        const recentHistory = chatHistory.slice(-10);

        const response = await fetch(GEMINI_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: recentHistory,
                systemInstruction: {
                    parts: [{
                        text: "You are JARVIS, the AI assistant from Iron Man. Address the user as 'sir'. Be concise, witty, intelligent, and helpful. Keep responses under 3 sentences unless the user asks for details. Speak in a sophisticated British butler tone. If user speaks in Hindi, respond in Hindi."
                    }]
                },
                generationConfig: { temperature: 0.9, maxOutputTokens: 250 }
            })
        });

        const data = await response.json();

        if (data.error) {
            console.error("API Error:", data.error);
            return "I am having trouble reaching my neural network, sir. " + (data.error.message || "");
        }

        const aiText = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: "model", parts: [{ text: aiText }] });
        return aiText;

    } catch (error) {
        console.error("Fetch error:", error);
        return "Network issue detected, sir. Please check your internet connection.";
    }
}

// ===== WEATHER (Free - No API Key) =====
function getWeather() {
    if (!navigator.geolocation) { addMessage('jarvis', 'Location not supported, sir.'); return; }
    modeLabel.textContent = 'Fetching weather...';
    navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
            const lat = pos.coords.latitude, lon = pos.coords.longitude;
            const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto";
            const res = await fetch(url);
            const data = await res.json();
            const temp = data.current.temperature_2m;
            const wind = data.current.wind_speed_10m;
            const humidity = data.current.relative_humidity_2m;
            const code = data.current.weather_code;
            const desc = weatherDesc(code);
            const msg = "Currently " + temp + " degrees Celsius with " + desc + ", sir. Humidity is " + humidity + " percent and wind speed is " + wind + " km/h.";
            addMessage('jarvis', msg);
            speak(msg);
        } catch (e) {
            addMessage('jarvis', 'Weather fetch failed, sir.');
            modeLabel.textContent = 'Standby';
        }
    }, () => {
        addMessage('jarvis', 'Location permission denied, sir.');
        modeLabel.textContent = 'Standby';
    });
}

function weatherDesc(code) {
    const map = { 0: "clear sky", 1: "mainly clear", 2: "partly cloudy", 3: "overcast", 45: "foggy", 48: "rime fog", 51: "light drizzle", 53: "moderate drizzle", 55: "dense drizzle", 61: "slight rain", 63: "moderate rain", 65: "heavy rain", 71: "slight snow", 73: "moderate snow", 75: "heavy snow", 80: "rain showers", 81: "moderate showers", 82: "violent showers", 95: "thunderstorm", 96: "thunderstorm with hail", 99: "heavy thunderstorm" };
    return map[code] || "unknown conditions";
}
